<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><rect width="1200" height="820" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="600" y="63" fill="#142338" font-size="35" font-weight="700" text-anchor="middle">Reality 주식토큰의 국내 과세 판단 구조</text><rect x="280" y="100" width="640" height="70" rx="14" fill="#f0f4fa" stroke="#d2dce8"/><text x="600" y="144" fill="#142338" font-size="29" font-weight="700" text-anchor="middle">주식토큰 매매차익 발생</text><path d="M600 174v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="205" width="640" height="87" rx="14" fill="#f0f4fa" stroke="#d2dce8"/><text x="600" y="241" fill="#142338" font-size="28" font-weight="700" text-anchor="middle">소득세법상 주식등에 해당하는가?</text><text x="600" y="274" fill="#65768b" font-size="21" font-weight="400" text-anchor="middle">소득세법 제88조·제94조</text><path d="M600 292v31H310v28M600 323h290v28" fill="none" stroke="#74859b" stroke-width="2.5"/><text x="310" y="341" fill="#254e7e" font-size="20" font-weight="700" text-anchor="middle">해당함</text><text x="890" y="341" fill="#254e7e" font-size="20" font-weight="700" text-anchor="middle">해당하지 않음</text><rect x="65" y="360" width="490" height="102" rx="14" fill="#edf4fb" stroke="#cdddeb"/><text x="310" y="401" fill="#142338" font-size="29" font-weight="700" text-anchor="middle">해외주식 양도소득세</text><text x="310" y="438" fill="#142338" font-size="22" font-weight="400" text-anchor="middle">기본공제 250만원 · 통상 22%</text><rect x="645" y="360" width="490" height="102" rx="14" fill="#f0f4fa" stroke="#d2dce8"/><text x="890" y="401" fill="#142338" font-size="27" font-weight="700" text-anchor="middle">기타 과세요건 검토</text><text x="890" y="438" fill="#142338" font-size="20" font-weight="400" text-anchor="middle">파생상품·수익권 등 해당 시 관련 규정</text><path d="M890 466v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" 