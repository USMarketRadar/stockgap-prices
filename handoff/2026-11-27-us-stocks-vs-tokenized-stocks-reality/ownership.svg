<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img"><rect width="1200" height="710" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="600" y="62" fill="#142338" font-size="38" font-weight="700" text-anchor="middle">전통 금융자산에서 블록체인 토큰으로</text><text x="600" y="98" fill="#65768b" font-size="21" font-weight="400" text-anchor="middle">Traditional Assets to Tokenized Assets</text><rect x="30" y="126" width="560" height="47" rx="14" fill="#eaf0f7" stroke="none"/><text x="310" y="157" fill="#142338" font-size="24" font-weight="700" text-anchor="middle">전통적인 미국주식 보유 방식</text><rect x="610" y="126" width="560" height="47" rx="14" fill="#e8f5f1" stroke="none"/><text x="890" y="157" fill="#142338" font-size="24" font-weight="700" text-anchor="middle">블록체인 기반 자산 토큰화</text><rect x="30" y="190" width="270" height="406" rx="14" fill="#ffffff" stroke="#d6e0e9"/><text x="165" y="230" fill="#254e7e" font-size="23" font-weight="700" text-anchor="middle">실물 주권·직접 등록</text><rect x="42" y="253" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="165" y="282" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">투자자</text><path d="M165 298v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="321" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="165" y="350" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">기업 주주명부</text><path d="M165 366v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="389" width="246" height="43" rx="9" fill="#e5eef8" stroke="#d8e1eb"/><text x="165" y="418" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">실제 미국주식</text><text x="165" y="573" fill="#254e7e" font-size="18" font-weight="600" text-anchor="middle">직접 등록된 주주</text><rect x="320" y="190" width="270" height="406" rx="14" fill="#ffffff" stroke="#d6e0e9"/><text x="455" y="230" fill="#254e7e" font-size="23" font-weight="700" text-anchor="middle">증권사 계좌</text><rect x="332" y="253" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="455" y="282" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">투자자</text><path d="M455 298v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="332" y="321" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="455" y="350" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">증권사 전자 장부</text><path d="M455 366v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="332" y="389" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="455" y="418" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">예탁·수탁기관</text><path d="M455 434v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="332" y="457" width="246" height="43" rx="9" fill="#e5eef8" stroke="#d8e1eb"/><text x="455" y="486" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">실제 미국주식</text><text x="455" y="573" fill="#254e7e" font-size="18" font-weight="600" text-anchor="middle">실제 주식에 대한 권리</text><rect x="610" y="190" width="270" height="406" rx="14" fill="#ffffff" stroke="#d6e0e9"/><text x="745" y="230" fill="#4e54a6" font-size="23" font-weight="700" text-anchor="middle">Reality (rNVDA)</text><rect x="622" y="253" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="745" y="282" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">투자자</text><path d="M745 298v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="622" y="321" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="745" y="350" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">rNVDA 주식토큰</text><path d="M745 366v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="622" y="389" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="745" y="418" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">Reality·수탁기관</text><path d="M745 434v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="622" y="457" width="246" height="43" rx="9" fill="#e5eef8" stroke="#d8e1eb"/><text x="745" y="486" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">실제 엔비디아 주식</text><text x="745" y="573" fill="#4e54a6" font-size="18" font-weight="600" text-anchor="middle">주식 연동 경제적 권리</text><rect x="900" y="190" width="270" height="406" rx="14" fill="#ffffff" stroke="#d6e0e9"/><text x="1035" y="230" fill="#168575" font-size="23" font-weight="700" text-anchor="middle">Tether (USDT)</text><rect x="912" y="253" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="1035" y="282" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">투자자</text><path d="M1035 298v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="912" y="321" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="1035" y="350" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">USDT 달러토큰</text><path d="M1035 366v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="912" y="389" width="246" height="43" rx="9" fill="#f6f8fb" stroke="#d8e1eb"/><text x="1035" y="418" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">Tether·준비자산 관리</text><path d="M1035 434v19m-6 -6 6 6 6 -6" fill="none" stroke="#74859b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="912" y="457" width="246" height="43" rx="9" fill="#e5eef8" stroke="#d8e1eb"/><text x="1035" y="486" fill="#142338" font-size="20" font-weight="500" text-anchor="middle">현금·미국 국채 등</text><text x="1035" y="573" fill="#168575" font-size="18" font-weight="600" text-anchor="middle">달러 가치 연동 토큰</text><text x="600" y="646" fill="#142338" font-size="24" font-weight="600" text-anchor="middle">실물자산을 기반으로 하더라도 보유 방식에 따라 법적 권리는 달라진다.</text><text x="600" y="680" fill="#65768b" font-size="19" font-weight="400" text-anchor="middle">자산 보유 및 담보 구조를 단순화한 개념도</text></g></svg>